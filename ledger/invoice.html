<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factura — DIAM'S COLORS Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/ledger.css">
<style>
  .invoice-sheet {
    max-width: 640px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-8);
    box-shadow: var(--shadow-md);
  }
  .invoice-letterhead {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    padding-bottom: var(--space-6);
    margin-bottom: var(--space-6);
    border-bottom: 1px solid var(--border);
  }
  .invoice-letterhead img { height: 56px; width: 56px; object-fit: contain; border-radius: 12px; }
  .invoice-letterhead h1 { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.02em; }
  .invoice-letterhead p { font-size: var(--text-sm); color: var(--text-2); }
  .invoice-meta {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: var(--space-4);
    margin-bottom: var(--space-6);
  }
  .invoice-meta-item .stat-label { font-size: var(--text-xs); }
  .invoice-meta-item .stat-value { font-size: var(--text-base); font-weight: 600; }
  .invoice-lines {
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-bottom: var(--space-6);
  }
  .materials-heading {
    font-size: var(--text-xs);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-2);
    margin-bottom: var(--space-3);
  }
  .invoice-line {
    display: flex;
    justify-content: space-between;
    padding: var(--space-4);
    border-bottom: 1px solid var(--border);
    font-size: var(--text-sm);
  }
  .invoice-line:last-child { border-bottom: none; }
  .invoice-line .label { color: var(--text-2); }
  .invoice-line .value { font-weight: 500; color: var(--text-1); font-variant-numeric: tabular-nums; }
  .invoice-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space-5) var(--space-6);
    background: var(--accent-bg);
    border: 1px solid rgba(5,150,105,0.18);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-6);
  }
  .invoice-total-row .label { font-size: var(--text-sm); font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
  .invoice-total-row .amount { font-size: var(--text-3xl); font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .invoice-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; }
  .invoice-disclaimer { font-size: var(--text-xs); color: var(--text-3); margin-top: var(--space-6); text-align: center; }

  @media (max-width: 640px) {
    .invoice-sheet { padding: var(--space-5); }
    .invoice-actions #printBtn { flex: 1 1 100%; }
    .invoice-actions a {
      flex: 1 1 calc(50% - var(--space-3) / 2);
      text-align: center;
      white-space: normal;
    }
  }

  @media print {
    .app-header, .invoice-actions, .toast { display: none !important; }
    body { background: #fff; }
    .page { padding: 0; }
    .invoice-sheet { border: none; box-shadow: none; padding: 0; }
  }
</style>
</head>
<body>

<header class="app-header">
  <a href="dashboard.html" class="app-brand">
    <img src="../diams colors logo .webp" alt="">
    <span>DIAM'S COLORS</span>
  </a>
  <nav class="app-nav" aria-label="Navegación principal">
    <a href="dashboard.html">Panel</a>
    <a href="history.html">Historial</a>
    <button type="button" class="icon-btn" id="logoutBtn" aria-label="Cerrar sesión" title="Cerrar sesión">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </nav>
</header>

<main class="page">
  <div id="invoiceContainer">
    <div class="invoice-sheet" aria-hidden="true">
      <div class="invoice-letterhead">
        <span class="skeleton" style="width:56px;height:56px;"></span>
        <div style="flex:1;">
          <span class="skeleton" style="width:60%;height:20px;margin-bottom:8px;"></span>
          <span class="skeleton" style="width:35%;height:14px;"></span>
        </div>
      </div>
      <div class="invoice-meta">
        <span class="skeleton" style="width:120px;height:36px;"></span>
        <span class="skeleton" style="width:120px;height:36px;"></span>
      </div>
      <span class="skeleton" style="width:100%;height:120px;display:block;margin-bottom:var(--space-6);"></span>
      <span class="skeleton" style="width:100%;height:76px;display:block;"></span>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-dot"></span><span id="toastText"></span></div>

<script type="module" src="js/invoice.js"></script>
</body>
</html>

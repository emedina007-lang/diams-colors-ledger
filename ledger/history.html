<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial — DIAM'S COLORS Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/ledger.css">
</head>
<body>

<header class="app-header">
  <a href="dashboard.html" class="app-brand">
    <img src="../diams colors logo .webp" alt="">
    <span>DIAM'S COLORS</span>
  </a>
  <nav class="app-nav" aria-label="Navegación principal">
    <a href="dashboard.html">Panel</a>
    <a href="history.html" class="active">Historial</a>
    <button type="button" class="icon-btn" id="logoutBtn" aria-label="Cerrar sesión" title="Cerrar sesión">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </nav>
</header>

<main class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Historial de facturas</h1>
      <p class="page-subtitle">Todas las facturas guardadas, ordenadas por fecha.</p>
    </div>
    <a href="dashboard.html" class="btn btn-primary">+ Nueva factura</a>
  </div>

  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Buscar por cliente..." aria-label="Buscar por cliente">
  </div>

  <div class="table-wrap">
    <div id="listContainer">
      <div aria-hidden="true">
        <div class="skeleton-row"><span class="skeleton" style="width:16%;"></span><span class="skeleton" style="width:18%;"></span><span class="skeleton" style="width:14%;"></span><span class="skeleton" style="width:8%;"></span><span class="skeleton" style="width:10%;"></span><span class="skeleton" style="width:10%;"></span><span class="skeleton" style="width:10%;"></span></div>
        <div class="skeleton-row"><span class="skeleton" style="width:20%;"></span><span class="skeleton" style="width:16%;"></span><span class="skeleton" style="width:12%;"></span><span class="skeleton" style="width:8%;"></span><span class="skeleton" style="width:10%;"></span><span class="skeleton" style="width:10%;"></span><span class="skeleton" style="width:10%;"></span></div>
        <div class="skeleton-row"><span class="skeleton" style="width:14%;"></span><span class="skeleton" style="width:20%;"></span><span class="skeleton" style="width:16%;"></span><span class="skeleton" style="width:8%;"></span><span class="skeleton" style="width:10%;"></span><span class="skeleton" style="width:10%;"></span><span class="skeleton" style="width:10%;"></span></div>
        <div class="skeleton-row"><span class="skeleton" style="width:18%;"></span><span class="skeleton" style="width:14%;"></span><span class="skeleton" style="width:18%;"></span><span class="skeleton" style="width:8%;"></span><span class="skeleton" style="width:10%;"></span><span class="skeleton" style="width:10%;"></span><span class="skeleton" style="width:10%;"></span></div>
      </div>
    </div>
  </div>

  <nav class="pagination" id="pagination" aria-label="Paginación" style="display:none;"></nav>
</main>

<div class="modal-backdrop" id="confirmBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h2 class="modal-title" id="confirmTitle">Eliminar factura</h2>
    <p class="modal-body">Esta acción no se puede deshacer. ¿Deseas eliminar esta factura permanentemente?</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="cancelDelete">Cancelar</button>
      <button type="button" class="btn btn-destructive" id="confirmDelete">Eliminar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-dot"></span><span id="toastText"></span></div>

<script type="module" src="js/history.js"></script>
</body>
</html>
